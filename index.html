<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Халкым минем — Портал татарской культуры</title>
  <style>
    :root {
      --primary: #064e3b;
      --primary-mid: #047857;
      --primary-light: #10b981;
      --gold: #d97706;
      --gold-dark: #b45309;
      --gold-light: #fef3c7;
      --accent-red: #b91c1c;
      --bg-cream: #faf7f2;
      --surface: #ffffff;
      --text: #1f2937;
      --text-muted: #4b5563;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: var(--bg-cream);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: radial-gradient(circle at top right, #047857, #064e3b 70%, #022c22);
      color: #fff;
      padding: 2.8rem 1.5rem 2rem;
      text-align: center;
      position: relative;
      border-bottom: 6px solid var(--gold);
    }
    header h1 {
      font-size: 2.4rem;
      color: #fef08a;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      margin-bottom: 0.5rem;
    }
    header p {
      font-size: 1.15rem;
      color: #e2e8f0;
      max-width: 850px;
      margin: 0 auto 1.5rem;
    }

    .audio-bar {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      color: #fef08a;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.2s;
    }
    .audio-bar:hover { background: rgba(255,255,255,0.25); transform: scale(1.03); }

    .tatar-ribbon {
      height: 14px;
      background: repeating-linear-gradient(45deg, #064e3b, #064e3b 16px, #d97706 16px, #d97706 32px, #dc2626 32px, #dc2626 48px, #fff 48px, #fff 64px);
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      padding: 1.1rem 1rem;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      flex-wrap: wrap;
    }
    .nav-btn {
      padding: 0.75rem 1.6rem;
      font-size: 1.05rem;
      font-family: inherit;
      border: 2px solid var(--primary);
      background: #fff;
      color: var(--primary);
      cursor: pointer;
      border-radius: 9999px;
      font-weight: bold;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(6,78,59,0.3);
    }

    main {
      max-width: 1220px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
    }

    .section-title {
      text-align: center;
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 0.4rem;
    }
    .section-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      font-size: 1.1rem;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: tabFade 0.35s ease; }
    @keyframes tabFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* 1. ДОСТОПРИМЕЧАТЕЛЬНОСТИ */
    .sights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }
    .sight-card {
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .sight-svg-wrap {
      width: 100%;
      height: 200px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid var(--gold);
    }
    .sight-svg-wrap svg { max-width: 100%; height: auto; }
    .sight-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .sight-body h3 { color: var(--primary); font-size: 1.35rem; margin-bottom: 0.3rem; }
    .sight-loc { color: var(--gold-dark); font-size: 0.95rem; font-weight: bold; margin-bottom: 0.75rem; }

    .game-box {
      background: #fff;
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 3rem;
    }
    .game-box-title {
      text-align: center;
      color: var(--primary);
      font-size: 1.7rem;
      margin-bottom: 0.5rem;
    }
    .quest-opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      max-width: 680px;
      margin: 1.5rem auto;
    }
    .quest-btn {
      padding: 1rem 1.4rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      text-align: left;
      font-family: inherit;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
